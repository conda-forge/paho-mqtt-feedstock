schema_version: 1

context:
  name: paho-mqtt
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/paho_mqtt/paho_mqtt-${{ version }}.tar.gz
  sha256: bcf706f03f1f49e0fc3ae166dc7b67ee35463496f8bdfd7c9c36181f6ba635c9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - paho
        - paho.mqtt
        - paho.mqtt.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - 3.*

about:
  license: EPL-2.0 AND BSD-3-Clause
  license_file: LICENSE.txt
  summary: MQTT version 3.1.1 client class
  description: Eclipse Paho MQTT Python Client
  homepage: http://eclipse.org/paho

extra:
  recipe-maintainers:
    - ilanschnell
    - nerohmot
    - beenje
